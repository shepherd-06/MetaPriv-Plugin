<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>🧠 MetaPriv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 400px;
            width: 350px;
            overflow: hidden;
        }

        #pageList {
            height: 280px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        #user-info {
            display: none;
        }

        #logoutBtn {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 0.75rem;
        }

        #syncBtn {
            position: absolute;
            bottom: 10px;
            border-radius: 0.5rem;
            width: 300px;
        }

        #syncSpinner {
            display: none;
            font-size: 0.8rem;
        }

    </style>
</head>

<body class="p-2 position-relative">

    <div id="login-section">
        <h6 class="mb-2">Login</h6>
        <input type="text" id="username" class="form-control form-control-sm mb-1" placeholder="Username" />
        <input type="password" id="password" class="form-control form-control-sm mb-1" placeholder="Password" />
        <button id="loginBtn" class="btn btn-sm btn-primary w-100">Login</button>
        <div id="loginMsg" class="text-danger mt-1" style="font-size: 0.8rem;"></div>
    </div>

    <div id="user-info">
        <button id="logoutBtn" class="btn btn-sm btn-outline-danger">Logout</button>
        <p class="mb-1">✅ Logged in as <strong id="displayUsername"></strong></p>
        <p class="mb-1">Active Pages:</p>
        <ul id="pageList" class="list-group mb-1"></ul>
        <button id="syncBtn" class="btn btn-sm btn-outline-primary w-100">
            <span id="syncBtnText">Sync Again</span>
            <span id="syncSpinner" class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span> </button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
